# Конфигурация Prometheus паттерна WiFi-Guard.
global:
  # 15 с: атака должна появиться на дашборде и в оповещениях не позднее чем
  # через 30 с (замер + вычисление правил), при этом нагрузка на аудит минимальна
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/wg-rules.yml
scrape_configs:
  - job_name: wifi-guard-audit
    static_configs:
      - targets: ["audit.wg-monitoring.svc.cluster.local:8004"]
