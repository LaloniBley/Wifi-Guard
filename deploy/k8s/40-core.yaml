# Начальный реестр доверенных ТД. Эталон hops (ref_hops) задаётся калибровкой:
#   python client/client_sim.py --scenario calibrate
# Дальнейший онбординг —
# через POST /api/admin/aps шлюза с ролью admin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wg-trusted-aps
  namespace: wg-core
data:
  seed.json: |
    [
      {"bssid": "a0:b1:c2:d3:e4:01", "ssid": "CORP-WIFI", "channel": 36,
       "security": "WPA3-SAE", "pmf_required": true, "ref_hops": null,
       "location": "Корпус 1, этаж 3"}
    ]
---
# Микросервис аутентификации и верификации
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: wg-core
  labels: {app.kubernetes.io/name: auth}
spec:
  selector: {app.kubernetes.io/name: auth}
  ports: [{name: http, port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: wg-core
  labels: {app.kubernetes.io/name: auth, app.kubernetes.io/part-of: wifi-guard}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: auth}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auth, app.kubernetes.io/part-of: wifi-guard}
    spec:
      automountServiceAccountToken: false   # сервису не нужен доступ к API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: auth
          image: wifi-guard/auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8001, name: http}]
          env:
            - {name: PORT, value: "8001"}
            - {name: DB_HOST, value: oracle.wg-data.svc.cluster.local}
            - {name: DB_USER, value: WIFIGUARD}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: wg-db, key: app-password}}
            - {name: AUDIT_URL, value: http://audit.wg-monitoring.svc.cluster.local:8004}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: wg-jwt, key: secret}}
            - {name: TOKEN_TTL_SECONDS, value: "900"}     # 15 мин — окно использования перехваченного токена
            - name: SEED_USERS
              valueFrom: {secretKeyRef: {name: wg-seed-users, key: users}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 1, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:                      # до 5 мин на ожидание запуска Oracle
            httpGet: {path: /healthz, port: 8001}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8001}
            timeoutSeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8001}
            timeoutSeconds: 5
            periodSeconds: 10
---
# Микросервис безопасности (ядро паттерна)
apiVersion: v1
kind: Service
metadata:
