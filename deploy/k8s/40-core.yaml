        - name: security
          image: wifi-guard/security:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8002, name: http}]
          env:
            - {name: PORT, value: "8002"}
            - {name: AUDIT_URL, value: http://audit.wg-monitoring.svc.cluster.local:8004}
            - {name: REGISTRY_URL, value: http://registry.wg-core.svc.cluster.local:8003}
            - {name: AUTH_URL, value: http://auth.wg-core.svc.cluster.local:8001}
            - {name: SUSPICIOUS_THRESHOLD, value: "0.4"}
