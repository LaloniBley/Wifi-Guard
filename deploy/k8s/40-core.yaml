  namespace: wg-core
  labels: {app.kubernetes.io/name: security}
spec:
  selector: {app.kubernetes.io/name: security}
  ports: [{name: http, port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security
  namespace: wg-core
  labels: {app.kubernetes.io/name: security, app.kubernetes.io/part-of: wifi-guard}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: security}
  template:
    metadata:
      labels: {app.kubernetes.io/name: security, app.kubernetes.io/part-of: wifi-guard}
    spec:
      automountServiceAccountToken: false   # сервису не нужен доступ к API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
