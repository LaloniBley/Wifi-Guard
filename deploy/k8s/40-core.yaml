            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:                      # до 5 мин на ожидание запуска Oracle
            httpGet: {path: /healthz, port: 8002}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8002}
            timeoutSeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: 8002}
            timeoutSeconds: 5
            periodSeconds: 10
---
