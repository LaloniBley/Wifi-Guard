# Микросервис мониторинга и аудита
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: wg-monitoring
  labels: {app.kubernetes.io/name: audit}
spec:
  selector: {app.kubernetes.io/name: audit}
  ports: [{name: http, port: 8004, targetPort: 8004}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: wg-monitoring
  labels: {app.kubernetes.io/name: audit, app.kubernetes.io/part-of: wifi-guard}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: audit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: audit, app.kubernetes.io/part-of: wifi-guard}
    spec:
      automountServiceAccountToken: false   # сервису не нужен доступ к API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: audit
          image: wifi-guard/audit:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8004, name: http}]
          env:
            - {name: PORT, value: "8004"}
            - {name: DB_HOST, value: oracle.wg-data.svc.cluster.local}
            - {name: DB_USER, value: WIFIGUARD}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: wg-db, key: app-password}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:                      # до 5 мин на ожидание запуска Oracle
            httpGet: {path: /healthz, port: 8004}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8004}
            timeoutSeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8004}
            timeoutSeconds: 5
            periodSeconds: 10
