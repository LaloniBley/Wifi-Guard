# TLS-терминатор шлюза доступа (контейнер nginx в поде gateway).
# Проверяет клиентский сертификат устройства (mTLS) и передаёт процессу
# шлюза (127.0.0.1:8080) результат проверки и сам сертификат.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # 10 запросов/с с всплеском 20: интерактивный клиент делает единицы
    # запросов в секунду, а перебор паролей и флуд ограничиваются
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate         /etc/wg/tls/tls.crt;
        ssl_certificate_key     /etc/wg/tls/tls.key;
        ssl_client_certificate  /etc/wg/tls/ca.crt;
        ssl_verify_client       optional;   # отказ без сертификата выдаёт шлюз (401)
        ssl_verify_depth        2;
        ssl_protocols           TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache       shared:SSL:10m;

        client_max_body_size 1m;

        location / {
            limit_req zone=perip burst=20 nodelay;
            # заголовки X-Client-* перезаписываются: подделать их клиент не может
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Client-Verify  $ssl_client_verify;
            proxy_set_header X-Client-Cert    $ssl_client_escaped_cert;
            proxy_set_header Host             $host;
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
