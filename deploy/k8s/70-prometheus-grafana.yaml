# Prometheus (сбор метрик) и Grafana (дашборды) для микросервиса мониторинга.
# Дашборд метрик безопасности настраивается в главе 4.
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: wg-monitoring}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s        # атака должна отражаться на дашборде в пределах 15 с
      evaluation_interval: 15s
    scrape_configs:
      - job_name: wifi-guard-audit
        static_configs:
          - targets: ["audit.wg-monitoring.svc.cluster.local:8004"]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: wg-monitoring, labels: {app.kubernetes.io/name: prometheus}}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: wg-monitoring
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: wifi-guard}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: wifi-guard}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d   # хранение метрик на время испытаний
          ports: [{containerPort: 9090, name: http}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, emptyDir: {sizeLimit: 2Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-datasources, namespace: wg-monitoring}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.wg-monitoring.svc.cluster.local:9090
        isDefault: true
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: wg-monitoring, labels: {app.kubernetes.io/name: grafana}}
spec:
  selector: {app.kubernetes.io/name: grafana}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: wg-monitoring
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: wifi-guard}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: wifi-guard}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: wg-grafana, key: admin-password}}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
          ports: [{containerPort: 3000, name: http}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: data, emptyDir: {}}
