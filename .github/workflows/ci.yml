# Конвейер CI/CD на GitHub Actions:
#   test     — статический анализ (ruff) и автотесты (pytest);
#   manifests— проверка манифестов Kubernetes по схемам API (kubeconform)
#              и модульные тесты правил оповещения Prometheus (promtool);
#   images   — сборка образов и публикация в GitHub Container Registry
#              (только для ветки main, после успешных тестов).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check common services client tests
      - run: pytest -q --cov=common --cov=services --cov-report=term

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize deploy/k8s | ./kubeconform -strict -summary -kubernetes-version 1.31.0 -
      - name: promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz | tar xz
          ./prometheus-2.55.1.linux-amd64/promtool check rules deploy/k8s/monitoring/wg-rules.yml
          ./prometheus-2.55.1.linux-amd64/promtool test rules tests/prometheus/wg-rules.test.yml

  images:
    if: github.ref == 'refs/heads/main'
    needs: [test, manifests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, security, registry, audit, portal, ttl-probe]
    steps:
      - uses: actions/checkout@v4
      # имена образов в GHCR должны быть в нижнем регистре (LaloniBley -> lalonibley)
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'ttl-probe' && 'services/ttl-probe/Dockerfile' || 'services/Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/wifi-guard-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/wifi-guard-${{ matrix.service }}:latest
